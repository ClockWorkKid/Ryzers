# init_image omitted: ryzers defaults to the ROCm 7.2.2 base
# (rocm/pytorch torch 2.10.0), which already ships the ROCm torch stack.
#
# Env knobs validated on Strix Halo (gfx1151) with the nano-world-model DiT sampling path:
#  * TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL + TORCH_BLAS_PREFER_HIPBLASLT=0 are REQUIRED —
#    without them the DiT sampling attention path stalls badly.
#  * MIOPEN_FIND_MODE=FAST avoids a multi-minute exhaustive conv search in the SD-VAE decode;
#    the mounted MIOpen + triton caches persist compiled kernels across `ryzers run` calls.

build_arguments:
- "LATTE_COMMIT=b27c24a17487e3c33ae4e92364521303d0f14845"

gpu_support: true
x11_display: false

environment_variables:
- "HSA_OVERRIDE_GFX_VERSION=11.5.1"
- "HF_HOME=/root/.cache/huggingface"
- 'HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}'
- 'HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-0}'
- "HF_HUB_DISABLE_TELEMETRY=1"
- "TOKENIZERS_PARALLELISM=false"
- "TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1"
- "TORCH_BLAS_PREFER_HIPBLASLT=0"
- "MIOPEN_FIND_MODE=FAST"
- "MIOPEN_USER_DB_PATH=/root/.cache/miopen"
- "MIOPEN_CUSTOM_CACHE_DIR=/root/.cache/miopen"
- "OUT_DIR=/outputs"
# Per-demo knobs (override from the host: VAR=... ryzers run /ryzers/demos/demo_*.sh).
- 'HF_TOKEN=${HF_TOKEN:-}'
- 'CONFIG=${CONFIG:-}'
- 'CKPT=${CKPT:-}'
- 'NUM_SAMPLING_STEPS=${NUM_SAMPLING_STEPS:-}'
- 'SAMPLE_METHOD=${SAMPLE_METHOD:-}'
- 'SEED=${SEED:-}'
- 'PROMPT=${PROMPT:-}'

volume_mappings:
- "$PWD/workspace/latte/outputs:/outputs"
- "$PWD/workspace/latte/models:/models"
- "$PWD/workspace/.cache/huggingface:/root/.cache/huggingface"
# Persist JIT-compiled ROCm kernels so only the first run pays the compile cost.
- "$PWD/workspace/.cache/triton:/root/.triton"
- "$PWD/workspace/.cache/miopen:/root/.cache/miopen"
