# Run C: FPGA-friendly pure-CNN student (no global attention). Same full-LIBERO
# distillation recipe as distill_full.yaml. Conv is cheap so depth/width are scaled
# up to use the budget: variant=cnn dim=384 conv=16 k3 -> ~120x compression (5.1 GFLOPs).

dependencies:
  - name: 'distill.register'

datasets:
  &train_set libero/train: !import_call
    key: 'distill.data.LiberoFrameDataset'
    init:
      kwargs:
        train: True
        repo_id: &repo 'allenai/MolmoAct2-LIBERO-Dataset'
        checkpoint_path: &ckpt 'allenai/MolmoAct2-LIBERO'
        patchify_mode: 'processor'
        subsample_stride: 1
        max_frames:
  &val_set libero/val: !import_call
    key: 'distill.data.LiberoFrameDataset'
    init:
      kwargs:
        train: False
        repo_id: *repo
        checkpoint_path: *ckpt
        patchify_mode: 'processor'
        max_frames: 1024

models:
  teacher_model:
    key: 'molmoact2_seam_teacher'
    kwargs:
      checkpoint_path: *ckpt
      model_dtype: 'bfloat16'
      already_normalized: True
    src_ckpt:
  student_model:
    key: 'vit_distill_student'
    kwargs:
      variant: 'cnn'
      dim: 384
      num_conv_blocks: 16
      conv_kernel: 3
    src_ckpt:
    dst_ckpt: './resource/ckpt/vit_distill/cnn_fpga_full.pt'

train:
  log_freq: 100
  num_epochs: 10
  train_data_loader:
    dataset_id: *train_set
    sampler:
      class_or_func: !import_get
        key: 'torch.utils.data.RandomSampler'
      kwargs:
    kwargs:
      batch_size: 32
      num_workers: 8
      pin_memory: True
      drop_last: True
  val_data_loader:
    dataset_id: *val_set
    sampler: &val_sampler
      class_or_func: !import_get
        key: 'torch.utils.data.SequentialSampler'
      kwargs:
    kwargs:
      batch_size: 32
      num_workers: 8
      pin_memory: True
      drop_last: False
  teacher:
    forward_proc: 'forward_batch_only'
    sequential: []
    wrapper:
    requires_grad: False
  student:
    forward_proc: 'forward_batch_only'
    adaptations:
    sequential: []
    frozen_modules: []
    wrapper: 'DistributedDataParallel'
    requires_grad: True
  optimizer:
    key: 'AdamW'
    kwargs:
      lr: 0.001
      weight_decay: 0.05
  scheduler:
    key: 'CosineAnnealingLR'
    kwargs:
      T_max: 10
  criterion:
    key: 'WeightedSumLoss'
    kwargs:
      sub_terms:
        seam:
          criterion:
            key: 'seam_distill'
            kwargs:
              student_module_path: '.'
              student_module_io: 'output'
              teacher_module_path: '.'
              teacher_module_io: 'output'
              cosine_weight: 1.0
              norm_mse_weight: 1.0
          weight: 1.0

test:
  test_data_loader:
    dataset_id: *val_set
    sampler: *val_sampler
    kwargs:
      batch_size: 32
      num_workers: 8
      pin_memory: True
      drop_last: False
