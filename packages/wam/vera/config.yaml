# ROCm 7.14 base (rocm/pytorch torch 2.10.0), the current standard for these ports.
init_image: rocm/pytorch:rocm7.14_ubuntu24.04_py3.12_pytorch_release_2.10.0

build_arguments:
- "VERA_COMMIT=fe8561aaa3783230d01d696987992f7eeacb2e12"

gpu_support: true
x11_display: false

environment_variables:
- "HSA_OVERRIDE_GFX_VERSION=11.5.1"
- "HF_HOME=/root/.cache/huggingface"
- 'HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}'
- 'HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-0}'
- 'HF_HUB_DOWNLOAD_TIMEOUT=${HF_HUB_DOWNLOAD_TIMEOUT:-60}'
- "HF_HUB_DISABLE_TELEMETRY=1"
- "TOKENIZERS_PARALLELISM=false"
# gfx1151 attention/decode tuning (matches the FastWAM/Cosmos3 Wan-on-ROCm findings):
# AOTriton SDPA on, hipBLASLt off (else DiT attention stalls; Wan VAE conv3d decode misbehaves).
- "TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1"
- "TORCH_BLAS_PREFER_HIPBLASLT=0"
# Headless MuJoCo render backend for the MimicGen closed-loop (osmesa software fallback available).
- "MUJOCO_GL=egl"
- "PYOPENGL_PLATFORM=egl"
- "OUT_DIR=/outputs"
# MimicGen task hdf5 come from the simulation/mimicgen base's /sim_data mount (rule 8); fetch with
# its scripts/download_mimicgen_datasets.sh. Kept overridable for a custom dataset location.
- 'MIMICGEN_DATASET_ROOT=${MIMICGEN_DATASET_ROOT:-/sim_data/mimicgen_datasets}'
# sim_mimicgen policy seam: demo_closedloop_mimicgen.sh sets these to drive the sim base harness
# against the VERA websocket server (POLICY_FACTORY=vera_mimicgen_policy:build_policy).
- 'POLICY_FACTORY=${POLICY_FACTORY:-}'
- 'POLICY_HOST=${POLICY_HOST:-}'
- 'POLICY_PORT=${POLICY_PORT:-}'
- 'PROMPT=${PROMPT:-}'
- 'CONTEXT_FRAMES=${CONTEXT_FRAMES:-}'
# VERA checkpoint locations (point at the mounted downloaded dirs; see scripts/download_checkpoints.sh).
- 'VERA_CKPT_ROOT=${VERA_CKPT_ROOT:-/models/vera-ckpts}'
- 'VERA_WAN_CKPT_ROOT=${VERA_WAN_CKPT_ROOT:-}'          # frozen Wan2.1-T2V-1.3B base (MimicGen)
- 'VERA_WAN14B_CKPT_ROOT=${VERA_WAN14B_CKPT_ROOT:-}'    # frozen Wan2.1-I2V-14B-480P base (DROID/OMNI)
- 'VERA_MIMICGEN_CKPT_DIR=${VERA_MIMICGEN_CKPT_DIR:-}'  # specialist DiT + flow decoder
- 'VERA_DROID_CKPT_DIR=${VERA_DROID_CKPT_DIR:-}'        # DROID WAN planner (DiT + algo_config.yaml)
# Per-demo knobs (override from host: VAR=... ryzers run /ryzers/demos/demo_*.sh).
- 'HF_TOKEN=${HF_TOKEN:-}'
- 'TEXT=${TEXT:-}'
- 'NUM_STEPS=${NUM_STEPS:-}'
- 'SEED=${SEED:-}'
- 'TAG=${TAG:-}'
- 'PORT=${PORT:-}'
- 'VIS_PORT=${VIS_PORT:-}'
- 'EMBODIMENT=${EMBODIMENT:-}'
# Closed-loop knobs (MimicGen / PushT closed-loop demos).
- 'NUM_DEMOS=${NUM_DEMOS:-}'
- 'ROLLOUT_HORIZON=${ROLLOUT_HORIZON:-}'
- 'RENDER_SIZE=${RENDER_SIZE:-}'
- 'SAMPLE_STEPS=${SAMPLE_STEPS:-}'
- 'ZARR_PATH=${ZARR_PATH:-}'
- 'FRAME_INDICES=${FRAME_INDICES:-}'
- 'N_REPEATS=${N_REPEATS:-}'
- 'HORIZON=${HORIZON:-}'
# img2vid knobs.
- 'IMAGE=${IMAGE:-}'
- 'VIEWS=${VIEWS:-}'

volume_mappings:
- "$PWD/workspace/vera/outputs:/outputs"
- "$PWD/workspace/vera/models:/models"
- "$PWD/workspace/.cache/huggingface:/root/.cache/huggingface"
# cotracker (MimicGen motion tracker) is torch.hub-fetched once; persist it (rule 8).
- "$PWD/workspace/vera/torch_cache:/root/.cache/torch"
