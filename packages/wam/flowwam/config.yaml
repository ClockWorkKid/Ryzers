# init_image omitted: FlowWAM is a model layer meant to chain on a base. Because it REQUIRES
# SAPIEN robot rendering + RoboTwin embodiments, chain it on the robotwin sim base:
#   ryzers build robotwin flowwam --name flowwam-robotwin

build_arguments:
- "FLOWWAM_COMMIT=f06fa46042e97738c6619c868f1097be6749d48d"

gpu_support: true
x11_display: false          # SAPIEN renders headless via Vulkan/EGL (provided by robotwin base)

environment_variables:
- "HSA_OVERRIDE_GFX_VERSION=11.5.1"
- "HF_HOME=/root/.cache/huggingface"
- 'HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}'
- 'HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-0}'
- 'HF_HUB_DOWNLOAD_TIMEOUT=${HF_HUB_DOWNLOAD_TIMEOUT:-60}'
- "HF_HUB_DISABLE_TELEMETRY=1"
- "TOKENIZERS_PARALLELISM=false"
# FlowWAM's build_pipeline loads Wan2.2 via DiffSynth ModelConfig(local_model_path=...); we point
# it at the mounted models dir so the large Wan2.2-TI2V-5B base is fetched/reused once on the host.
- "FLOWWAM_MODEL_DIR=/models/flowwam"
- "TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1"
- "TORCH_BLAS_PREFER_HIPBLASLT=0"
- "PYTORCH_HIP_ALLOC_CONF=expandable_segments:True"
- "OUT_DIR=/outputs"
# Per-demo knobs (override from the host: VAR=... ryzers run /ryzers/demos/demo_*.sh).
- 'HF_TOKEN=${HF_TOKEN:-}'
- 'NUM_INFERENCE_STEPS=${NUM_INFERENCE_STEPS:-}'
- 'SIGMA_SHIFT=${SIGMA_SHIFT:-}'
- 'NUM_OUTPUT_FRAMES=${NUM_OUTPUT_FRAMES:-}'
- 'SEED=${SEED:-}'
- 'TAG=${TAG:-}'
- 'MAX_EPISODES=${MAX_EPISODES:-}'
- 'EPISODES=${EPISODES:-}'
- 'MAX_ROLLOUTS=${MAX_ROLLOUTS:-}'
- 'MAX_STRIDE=${MAX_STRIDE:-}'
- 'CAMERA=${CAMERA:-}'
- 'FLOW_METHOD=${FLOW_METHOD:-}'
- 'TEST_DATASET_DIR=${TEST_DATASET_DIR:-}'
# Closed-loop / interactive RoboTwin knobs (require the simulation/robotwin base).
- 'TASK=${TASK:-}'
- 'TASKS=${TASKS:-}'
- 'TASK_CONFIG=${TASK_CONFIG:-}'
- 'MAX_STEPS=${MAX_STEPS:-}'
- 'PORT=${PORT:-}'
- 'POLICY_FACTORY=${POLICY_FACTORY:-}'

docker_extra_run_flags: "--shm-size=16g"

volume_mappings:
- "$PWD/workspace/flowwam/outputs:/outputs"
- "$PWD/workspace/flowwam/models:/models"
- "$PWD/workspace/.cache/huggingface:/root/.cache/huggingface"
