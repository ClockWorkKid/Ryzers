# Consolidated AVDC model layer - build ON TOP of the simulation/ithor sim base:
#   ryzers build ithor avdc --name avdc
# The base supplies ai2thor + Vulkan/CloudRendering + the sim_ithor harness (and its /sim_outputs,
# /sim_data, ~/.ai2thor mounts + Vulkan/THOR env, concatenated with the ones below). This layer
# adds the AVDC model + the vendored Meta-World MuJoCo sim, so ONE image runs all three demos:
# open-loop video prediction, closed-loop Meta-World, and closed-loop iTHOR ObjectNav.

build_arguments:
- "AVDC_COMMIT=e9b5b0098e59da0e1fe24a18ed9bec5b825e2ca2"

gpu_support: true
x11_display: false

environment_variables:
- "HSA_OVERRIDE_GFX_VERSION=11.5.1"
- "HF_HOME=/root/.cache/huggingface"
- 'HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}'
- 'HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-0}'
- "HF_HUB_DISABLE_TELEMETRY=1"
- "TOKENIZERS_PARALLELISM=false"
- "TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1"
- "TORCH_BLAS_PREFER_HIPBLASLT=0"
# MIOpen NORMAL: search+cache good conv kernels for the 3D-UNet + UniMatch flow on gfx1151 (cached
# in the mounted MIOpen dir; only the first run pays it). NOTE: the Meta-World UNet (128x128x7) has
# heavy 3D convs whose exhaustive NORMAL search is very slow to warm - set MIOPEN_FIND_MODE=FAST for
# quick MW smoke runs (immediate kernels), NORMAL for peak throughput once cached.
- 'MIOPEN_FIND_MODE=${MIOPEN_FIND_MODE:-NORMAL}'
- "MIOPEN_USER_DB_PATH=/root/.cache/miopen"
- "MIOPEN_CUSTOM_CACHE_DIR=/root/.cache/miopen"
# Inference optimizations (same 3D-UNet for MW + iTHOR): fp16 autocast + torch.compile the UNet.
# Quality-gated (open-loop output + closed-loop success preserved). Opt-out via env.
- 'AVDC_AMP=${AVDC_AMP:-fp16}'
- 'AVDC_COMPILE=${AVDC_COMPILE:-1}'
- 'AVDC_COMPILE_MODE=${AVDC_COMPILE_MODE:-default}'
- "TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor"
- "OUT_DIR=/outputs"
- "MODELS_DIR=/models"
# Checkpoint selection. Left empty so each demo wrapper picks its sim-appropriate default
# (Meta-World: /models/metaworld model-24; iTHOR: /models/ithor model-16). Override from host.
- 'WHICH=${WHICH:-}'
- 'CKPT_DIR=${CKPT_DIR:-}'
- 'MILESTONE=${MILESTONE:-}'
- 'SAMPLE_STEPS=${SAMPLE_STEPS:-}'
- 'RGD_TFM_TRIES=${RGD_TFM_TRIES:-}'
# --- Open-loop video-prediction knobs (demo_openloop) --------------------------------------------
- 'IMAGE=${IMAGE:-}'
- 'TEXT=${TEXT:-}'
- 'GUIDANCE=${GUIDANCE:-}'
- 'FLOW=${FLOW:-}'
- 'SEED=${SEED:-}'
# --- Closed-loop Meta-World knobs (demo_metaworld / demo_metaworld_benchmark) -------------------
- "MUJOCO_GL=egl"
- 'ENV_NAME=${ENV_NAME:-}'
- 'CAMERA=${CAMERA:-}'
- 'MAX_REPLANS=${MAX_REPLANS:-}'
# --- Closed-loop iTHOR ObjectNav knobs (demo_ithor / demo_ithor_benchmark; sim base reads these) --
- 'THOR_PLATFORM=${THOR_PLATFORM:-CloudRendering}'
- 'THOR_GPU_DEVICE=${THOR_GPU_DEVICE:-0}'
- 'VK_ICD_FILENAMES=${VK_ICD_FILENAMES:-/usr/share/vulkan/icd.d/radeon_icd.json}'
- 'SCENE=${SCENE:-}'
- 'TARGET=${TARGET:-}'
- 'TASKS=${TASKS:-}'
- 'N_SEEDS=${N_SEEDS:-}'
- 'RESOLUTION=${RESOLUTION:-}'
- 'MAX_EPLEN=${MAX_EPLEN:-}'
- 'RENDER_RESOLUTION=${RENDER_RESOLUTION:-}'
# Policy seam: default to the AVDC adapter so the sim base benchmark driver drives AVDC.
- 'POLICY_FACTORY=${POLICY_FACTORY:-avdc_ithor_policy:build_policy}'

volume_mappings:
- "$PWD/workspace/avdc/outputs:/outputs"
- "$PWD/workspace/avdc/models:/models"
- "$PWD/workspace/avdc/data:/data"
- "$PWD/workspace/.cache/huggingface:/root/.cache/huggingface"
# Persist JIT-compiled ROCm kernels so only the first run pays the compile cost.
- "$PWD/workspace/.cache/triton:/root/.triton"
- "$PWD/workspace/.cache/miopen:/root/.cache/miopen"
- "$PWD/workspace/.cache/torchinductor:/root/.cache/torchinductor"
