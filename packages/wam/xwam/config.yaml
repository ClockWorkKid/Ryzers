# init_image omitted: ryzers defaults to the ROCm 7.2.2 base
# (rocm/pytorch torch 2.10.0), which already ships the ROCm torch stack.

build_arguments:
- "XWAM_COMMIT=72cfb86b33fc5060963ef63412f16439fcfa472f"

gpu_support: true
x11_display: false

environment_variables:
- "HSA_OVERRIDE_GFX_VERSION=11.5.1"
- "PYTHONPATH=/repos/xwam"
- "HF_HOME=/root/.cache/huggingface"
- 'HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}'
- 'HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-0}'
- 'HF_HUB_DOWNLOAD_TIMEOUT=${HF_HUB_DOWNLOAD_TIMEOUT:-60}'
- "HF_HUB_DISABLE_TELEMETRY=1"
- "TOKENIZERS_PARALLELISM=false"
- "MUJOCO_GL=egl"
- "PYOPENGL_PLATFORM=egl"
- "TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1"
- "TORCH_BLAS_PREFER_HIPBLASLT=0"
- "OUT_DIR=/outputs"
# Model/checkpoint locations (populated at runtime by scripts/download_checkpoints.sh).
- 'XWAM_REPO=${XWAM_REPO:-/repos/xwam}'
- 'CKPT_ROOT=${CKPT_ROOT:-/models/xwam/checkpoints}'
- 'WAN_CKPT_DIR=${WAN_CKPT_DIR:-/models/xwam/wan22_5b}'
# Per-demo knobs (override from the host: VAR=... ryzers run /ryzers/demos/demo_*.sh).
- 'HF_TOKEN=${HF_TOKEN:-}'
- 'SEED=${SEED:-}'
- 'TAG=${TAG:-}'
- 'PROMPT=${PROMPT:-}'
- 'DATASET=${DATASET:-}'
- 'EXP=${EXP:-}'
# X-WAM inference knobs (async denoising is the headline efficiency lever).
- 'DENOISE_STEPS=${DENOISE_STEPS:-}'
- 'ACTION_DENOISE_STEPS=${ACTION_DENOISE_STEPS:-}'
- 'FRAME_NUM=${FRAME_NUM:-}'
- 'CFG=${CFG:-}'
- 'RUN_DEPTH=${RUN_DEPTH:-}'
- 'NUM_EPISODES=${NUM_EPISODES:-}'
- 'NUM_VIDEOS=${NUM_VIDEOS:-}'
- 'VISUALIZE_FUTURE=${VISUALIZE_FUTURE:-}'
# Interactive/closed-loop RoboTwin demo knobs (require the simulation/robotwin base).
- 'TASK=${TASK:-}'
- 'TASKS=${TASKS:-}'
- 'TASK_CONFIG=${TASK_CONFIG:-}'
- 'MAX_STEPS=${MAX_STEPS:-}'
- 'ACTION_HORIZON=${ACTION_HORIZON:-}'
- 'PORT=${PORT:-}'
- 'POLICY_FACTORY=${POLICY_FACTORY:-}'

volume_mappings:
- "$PWD/workspace/xwam/outputs:/outputs"
- "$PWD/workspace/xwam/models:/models"
- "$PWD/workspace/.cache/huggingface:/root/.cache/huggingface"
