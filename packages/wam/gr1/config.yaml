# init_image omitted: ryzers defaults to the ROCm 7.2.2 base
# (rocm/pytorch torch 2.10.0), which already ships the ROCm torch stack.
#
# Env knobs validated on Strix Halo (gfx1151) for the ROCm transformer sampling/attention path:
#  * TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL + TORCH_BLAS_PREFER_HIPBLASLT=0 keep the attention
#    matmul path stable on gfx1151.
#  * MIOPEN_FIND_MODE=FAST avoids a multi-minute exhaustive conv search in the MAE ViT patch conv;
#    the mounted MIOpen + triton caches persist compiled kernels across `ryzers run` calls.

build_arguments:
- "GR1_COMMIT=4a2e956bb497586d82489eb4c98b27fb82b5ff47"

gpu_support: true
x11_display: false

environment_variables:
- "HSA_OVERRIDE_GFX_VERSION=11.5.1"
- "HF_HOME=/root/.cache/huggingface"
- 'HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}'
- 'HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-0}'
- "HF_HUB_DISABLE_TELEMETRY=1"
- "TOKENIZERS_PARALLELISM=false"
- "TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1"
- "TORCH_BLAS_PREFER_HIPBLASLT=0"
- "MIOPEN_FIND_MODE=FAST"
- "MIOPEN_USER_DB_PATH=/root/.cache/miopen"
- "MIOPEN_CUSTOM_CACHE_DIR=/root/.cache/miopen"
- "OUT_DIR=/outputs"
- "MODELS_DIR=/models"
# Weight/eval paths (override from the host: VAR=... ryzers run /ryzers/demos/demo_*.sh).
- 'MAE_CKPT=${MAE_CKPT:-/models/mae_pretrain_vit_base.pth}'
- 'POLICY_CKPT=${POLICY_CKPT:-/models/snapshot_ABCD.pt}'
- 'CONFIGS=${CONFIGS:-/repos/gr1/logs/configs.json}'
- 'WHICH=${WHICH:-}'
# demo_openloop.sh knobs (phase 2, offline replay).
- 'DATASET_DIR=${DATASET_DIR:-/data/calvin_debug_dataset}'
- 'WINDOW_IDX=${WINDOW_IDX:-}'
- 'MAX_STEPS=${MAX_STEPS:-}'
- 'SPLIT=${SPLIT:-}'
- 'SEED=${SEED:-}'
# CALVIN closed-loop eval (phase 3, demo_calvin.sh). CALVIN_ROOT defaults to the baked sim
# checkout; EP_LEN is the max closed-loop steps per task; NUM_TASKS caps how many annotated tasks
# to roll out (0 = all).
- 'CALVIN_ROOT=${CALVIN_ROOT:-/repos/calvin}'
- 'EP_LEN=${EP_LEN:-}'
- 'NUM_TASKS=${NUM_TASKS:-}'
# Phase 4 inference optimizations (demos/gr1_optim.py; see OPTIMIZATIONS.md). Defaults = the
# recommended fast config fp16 + SDPA (6.8x vs fp32, closed-loop 8/8, arm MAE unchanged). Set
# GR1_AMP=off GR1_SDPA=0 for the fp32 numerical reference, or add GR1_COMPILE=1 for max
# throughput (8.7x, also 8/8, at a one-time first-step compile cost).
- 'GR1_AMP=${GR1_AMP:-fp16}'
- 'GR1_SDPA=${GR1_SDPA:-1}'
# Pin the ROCm-native FLASH (AOTriton) SDPA backend when SDPA is on (priority flash -> mem-eff ->
# math). gfx1151 has no standalone flash_attn/CK kernels; SDPA's FLASH backend IS the ROCm flash.
- 'GR1_FLASH=${GR1_FLASH:-1}'
- 'GR1_COMPILE=${GR1_COMPILE:-0}'
- 'GR1_COMPILE_MODE=${GR1_COMPILE_MODE:-default}'
- 'GR1_TAG=${GR1_TAG:-run}'
- 'BENCH_STEPS=${BENCH_STEPS:-}'
- 'BENCH_WARMUP=${BENCH_WARMUP:-}'

volume_mappings:
- "$PWD/workspace/gr1/outputs:/outputs"
- "$PWD/workspace/gr1/models:/models"
- "$PWD/workspace/gr1/data:/data"
- "$PWD/workspace/.cache/huggingface:/root/.cache/huggingface"
# Persist JIT-compiled ROCm kernels so only the first run pays the compile cost.
- "$PWD/workspace/.cache/triton:/root/.triton"
- "$PWD/workspace/.cache/miopen:/root/.cache/miopen"
