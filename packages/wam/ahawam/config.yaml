# init_image omitted: ryzers defaults to the ROCm 7.2.2 base
# (rocm/pytorch torch 2.10.0), which already ships the ROCm torch stack.

build_arguments:
- "AHAWAM_COMMIT=69076f6206518554477be5639deb016eee03a9d6"

gpu_support: true
x11_display: false

environment_variables:
- "HSA_OVERRIDE_GFX_VERSION=11.5.1"
- "HF_HOME=/root/.cache/huggingface"
- 'HF_HUB_DISABLE_XET=${HF_HUB_DISABLE_XET:-1}'
- 'HF_HUB_ENABLE_HF_TRANSFER=${HF_HUB_ENABLE_HF_TRANSFER:-0}'
- 'HF_HUB_DOWNLOAD_TIMEOUT=${HF_HUB_DOWNLOAD_TIMEOUT:-60}'
- "HF_HUB_DISABLE_TELEMETRY=1"
- "TOKENIZERS_PARALLELISM=false"
- "DIFFSYNTH_MODEL_BASE_PATH=/models/diffsynth"
- 'DIFFSYNTH_DOWNLOAD_SOURCE=${DIFFSYNTH_DOWNLOAD_SOURCE:-modelscope}'
- "MUJOCO_GL=egl"
- "PYOPENGL_PLATFORM=egl"
- "TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1"
- "TORCH_BLAS_PREFER_HIPBLASLT=0"
- "OUT_DIR=/outputs"
# Per-demo knobs (override from the host: VAR=... ryzers run /ryzers/demos/demo_*.sh).
- 'HF_TOKEN=${HF_TOKEN:-}'
- 'NUM_STEPS=${NUM_STEPS:-}'
- 'SEED=${SEED:-}'
- 'TAG=${TAG:-}'
- 'SUITE=${SUITE:-}'
- 'TASK_ID=${TASK_ID:-}'
- 'NUM_TASKS=${NUM_TASKS:-}'
- 'NUM_TRIALS=${NUM_TRIALS:-}'
- 'NUM_EPISODES=${NUM_EPISODES:-}'
- 'NUM_VIDEOS=${NUM_VIDEOS:-}'
- 'VISUALIZE_FUTURE=${VISUALIZE_FUTURE:-}'
# Interactive/real-time LIBERO demo knobs (require the simulation/libero base).
- 'PORT=${PORT:-}'
- 'VIEW_RES=${VIEW_RES:-}'
- 'VIDEO_RES=${VIDEO_RES:-}'
- 'RT_HZ=${RT_HZ:-}'
- 'CKPT=${CKPT:-}'
- 'DATASET_STATS=${DATASET_STATS:-}'
- 'MIXED_PRECISION=${MIXED_PRECISION:-}'
- 'NUM_INFERENCE_STEPS=${NUM_INFERENCE_STEPS:-}'
- 'REPLAN_STEPS=${REPLAN_STEPS:-}'
- 'NUM_STEPS_WAIT=${NUM_STEPS_WAIT:-}'
- 'POLICY_FACTORY=${POLICY_FACTORY:-}'
# Interactive/closed-loop RoboTwin demo knobs (require the simulation/robotwin base).
- 'TASK=${TASK:-}'
- 'TASKS=${TASKS:-}'
- 'TASK_CONFIG=${TASK_CONFIG:-}'
- 'MAX_STEPS=${MAX_STEPS:-}'
- 'ACTION_HORIZON=${ACTION_HORIZON:-}'

volume_mappings:
- "$PWD/workspace/ahawam/outputs:/outputs"
- "$PWD/workspace/ahawam/models:/models"
- "$PWD/workspace/.cache/huggingface:/root/.cache/huggingface"
