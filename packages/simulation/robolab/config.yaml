# init_image omitted: ryzers defaults to the ROCm 7.2.2 base
# (rocm/pytorch torch 2.10.0), which already ships the ROCm torch stack.
# This is a model-agnostic simulator base; chain a policy on top with
#   ryzers build simulation/robolab <policy>

gpu_support: true
x11_display: false

environment_variables:
- "HSA_OVERRIDE_GFX_VERSION=11.5.1"
- "MUJOCO_GL=egl"
- "PYOPENGL_PLATFORM=egl"
- "TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL=1"
- "TORCH_BLAS_PREFER_HIPBLASLT=0"
# Distinct container target so this base's outputs mount does not collide with a policy
# layer's /outputs when chained (ryzers concatenates volume mappings).
- "OUT_DIR=/sim_outputs"
# Real YCB meshes live on the mounted volume (fetched + coacd-decomposed at runtime, never
# baked). ROBOLAB_USE_YCB=0 forces the primitive fallback (no network needed).
- "ROBOLAB_ASSETS_DIR=/models/robolab_assets"
- 'ROBOLAB_USE_YCB=${ROBOLAB_USE_YCB:-1}'
# Sim/harness knobs (override from the host: VAR=... ryzers run /ryzers/demos/demo_*.sh).
- 'TASK=${TASK:-}'
- 'SEED=${SEED:-}'
- 'STEPS=${STEPS:-}'
- 'PORT=${PORT:-}'
- 'VIEW_RES=${VIEW_RES:-}'
- 'VIDEO_RES=${VIDEO_RES:-}'
- 'MAX_STEPS=${MAX_STEPS:-}'
# Policy selection: module:function returning a sim_robolab.Policy (default RandomPolicy).
- 'POLICY_FACTORY=${POLICY_FACTORY:-}'

volume_mappings:
- "$PWD/workspace/simulation-robolab/outputs:/sim_outputs"
- "$PWD/workspace/simulation-robolab/assets:/models/robolab_assets"
