# Model-agnostic base; chain a policy: ryzers build robotwin <policy>

environment_variables:
# Set HF_TOKEN on the host before running for faster (authenticated) asset downloads.
- 'HF_TOKEN=${HF_TOKEN:-}'
# Sim knobs, forwarded from the host: VAR=... ryzers run /ryzers/demos/demo_*.sh
- 'TASK=${TASK:-}'
- 'TASK_CONFIG=${TASK_CONFIG:-}'
- 'SEED=${SEED:-}'
- 'MAX_STEPS=${MAX_STEPS:-}'
- 'PORT=${PORT:-}'
- 'VIEW_RES=${VIEW_RES:-}'
- 'VIDEO_RES=${VIDEO_RES:-}'
- 'RT_HZ=${RT_HZ:-}'
# Policy selection: module:function returning a sim_robotwin.Policy (default RandomPolicy).
- 'POLICY_FACTORY=${POLICY_FACTORY:-}'

# /sim_* mount points so they don't collide with a chained policy's /outputs and /models.
volume_mappings:
- "$PWD/workspace/simulation-robotwin/outputs:/sim_outputs"
- "$PWD/workspace/simulation-robotwin/models:/sim_models"
- "$PWD/workspace/.cache/huggingface:/root/.cache/huggingface"
