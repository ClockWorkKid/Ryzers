# Model-agnostic sim base; chain a policy: ryzers build libero <policy>

environment_variables:
- "MUJOCO_GL=egl"
- "PYOPENGL_PLATFORM=egl"
# Sim knobs, forwarded from the host: VAR=... ryzers run /ryzers/demos/demo_*.sh
- 'SUITE=${SUITE:-}'
- 'TASK_ID=${TASK_ID:-}'
- 'SEED=${SEED:-}'
- 'STEPS=${STEPS:-}'
- 'MAX_STEPS=${MAX_STEPS:-}'
- 'PORT=${PORT:-}'
- 'VIEW_RES=${VIEW_RES:-}'
- 'VIDEO_RES=${VIDEO_RES:-}'
- 'RENDER_RES=${RENDER_RES:-}'
- 'RT_HZ=${RT_HZ:-}'
# Policy selection: module:function returning a sim_libero.Policy (default RandomPolicy).
- 'POLICY_FACTORY=${POLICY_FACTORY:-}'

# /sim_outputs so it doesn't collide with a chained policy's /outputs.
volume_mappings:
- "$PWD/workspace/simulation-libero/outputs:/sim_outputs"
